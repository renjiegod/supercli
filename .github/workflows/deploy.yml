name: Deploy reviewed main
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Record deployment revision
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("dist/deployment.json", JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID}) + "\n")'
      - name: Check main is still current
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skip superseded revision $GITHUB_SHA"
          fi
      - name: Deploy to Cloudflare Pages
        if: steps.revision.outputs.current == 'true'
        run: pnpm exec wrangler pages deploy dist --project-name supercli --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "916ebb1b9f240bf4c8826021dd161692"
      - name: Verify production revision
        if: steps.revision.outputs.current == 'true'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const expected = process.env.GITHUB_SHA;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch(`https://supercli.site/deployment.json?revision=${expected}`, {cache:'no-store', signal:AbortSignal.timeout(15000)});
              assert(response.ok, `HTTP ${response.status}`);
              const marker = await response.json();
              assert.equal(marker.commit, expected);
              console.log(`Production verified: ${marker.commit}`);
              process.exit(0);
            } catch (error) {
              console.error(`Verification attempt ${attempt + 1}: ${error.message}`);
              if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          process.exit(1);
          JS
