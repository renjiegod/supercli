name: 修正工具信息
description: 反馈失效链接、安装说明、来源分类或其他信息错误。
title: "[信息修正] "
labels: ["待核验"]
body:
  - type: input
    id: tool
    attributes:
      label: 工具名称或 SuperCLI 详情链接
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: 哪些信息需要修正？
      description: 请提供正确内容与可核验的来源。
    validations:
      required: true
